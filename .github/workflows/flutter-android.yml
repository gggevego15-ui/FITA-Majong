name: Flutter mobile builds

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native Android project files
        run: |
          flutter create /tmp/fita_native --project-name fita_mahjong --platforms=android,ios
          cp -R /tmp/fita_native/android ./android
      - name: Check Firebase runtime configuration
        env:
          FITA_FIREBASE_PROJECT_ID: ${{ vars.FITA_FIREBASE_PROJECT_ID }}
          FITA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FITA_FIREBASE_MESSAGING_SENDER_ID }}
          FITA_FIREBASE_ANDROID_API_KEY: ${{ vars.FITA_FIREBASE_ANDROID_API_KEY }}
          FITA_FIREBASE_ANDROID_APP_ID: ${{ vars.FITA_FIREBASE_ANDROID_APP_ID }}
        run: |
          missing=""
          for name in FITA_FIREBASE_PROJECT_ID FITA_FIREBASE_MESSAGING_SENDER_ID FITA_FIREBASE_ANDROID_API_KEY FITA_FIREBASE_ANDROID_APP_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Firebase Android config is incomplete. APK will be local-only; missing variables:$missing"
          else
            echo "Firebase Android runtime configuration is present (values not printed)."
          fi
      - run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Build Android APK
        env:
          FITA_FIREBASE_PROJECT_ID: ${{ vars.FITA_FIREBASE_PROJECT_ID }}
          FITA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FITA_FIREBASE_MESSAGING_SENDER_ID }}
          FITA_FIREBASE_ANDROID_API_KEY: ${{ vars.FITA_FIREBASE_ANDROID_API_KEY }}
          FITA_FIREBASE_ANDROID_APP_ID: ${{ vars.FITA_FIREBASE_ANDROID_APP_ID }}
          FITA_FIREBASE_IOS_API_KEY: ${{ vars.FITA_FIREBASE_IOS_API_KEY }}
          FITA_FIREBASE_IOS_APP_ID: ${{ vars.FITA_FIREBASE_IOS_APP_ID }}
          FITA_IOS_BUNDLE_ID: ${{ vars.FITA_IOS_BUNDLE_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FITA_FIREBASE_PROJECT_ID="$FITA_FIREBASE_PROJECT_ID" \
            --dart-define=FITA_FIREBASE_MESSAGING_SENDER_ID="$FITA_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FITA_FIREBASE_ANDROID_API_KEY="$FITA_FIREBASE_ANDROID_API_KEY" \
            --dart-define=FITA_FIREBASE_ANDROID_APP_ID="$FITA_FIREBASE_ANDROID_APP_ID" \
            --dart-define=FITA_FIREBASE_IOS_API_KEY="$FITA_FIREBASE_IOS_API_KEY" \
            --dart-define=FITA_FIREBASE_IOS_APP_ID="$FITA_FIREBASE_IOS_APP_ID" \
            --dart-define=FITA_IOS_BUNDLE_ID="$FITA_IOS_BUNDLE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: fita-mahjong-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
